name: Deploy index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset and verify MD5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/deploy
          gh release download deploy-v20261123_1802 --pattern index.html --dir /tmp/deploy --repo fighterchicken350/sangokushi-gunyu-survival
          echo "f7501dcea3e8941829dc4bf92eb8ec23  /tmp/deploy/index.html" | md5sum -c -
          cp /tmp/deploy/index.html ./index.html
      - name: Commit new index and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/deploy-index.yml
          git add index.html .github/workflows/deploy-index.yml
          git commit -m "v20261123_1802"
          git push
