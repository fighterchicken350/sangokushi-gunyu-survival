name: Deploy index

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/deploy-index.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/deploy
          gh release download deploy-v20261124_0328 --repo fighterchicken350/sangokushi-gunyu-survival --pattern 'publish_index_v20261124_0328.html' --dir /tmp/deploy
      - name: Verify md5 and replace index.html
        run: |
          echo "510ea6d75dc70a607334889e19678d92  /tmp/deploy/publish_index_v20261124_0328.html" | md5sum -c -
          cp /tmp/deploy/publish_index_v20261124_0328.html index.html
      - name: Commit index.html and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/deploy-index.yml
          git add index.html .github/workflows/deploy-index.yml
          git commit -m "v20261124_0328"
          git push
