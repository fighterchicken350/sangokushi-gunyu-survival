name: Deploy index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download release asset and verify md5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download deploy-v20261124_1208 --repo fighterchicken350/sangokushi-gunyu-survival --pattern 'index.html' --dir /tmp/deploy-asset
          ACTUAL_MD5=$(md5sum /tmp/deploy-asset/index.html | awk '{print $1}')
          echo "md5: $ACTUAL_MD5"
          if [ "$ACTUAL_MD5" != "7214d81589a9b577b5d3f7ccb12f2687" ]; then
            echo "md5 mismatch: expected 7214d81589a9b577b5d3f7ccb12f2687, got $ACTUAL_MD5" >&2
            exit 1
          fi
          cp /tmp/deploy-asset/index.html ./index.html
      - name: Commit and delete workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/deploy-index.yml
          git add index.html .github/workflows/deploy-index.yml
          git commit -m "v20261124_1208: boss pressure/mobs/S3 HP/heal drops (#186-189)"
          git push
