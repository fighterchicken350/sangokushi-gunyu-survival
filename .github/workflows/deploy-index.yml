name: Deploy index.html

on:
  push:
    paths:
      - '.github/workflows/deploy-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset and verify MD5
        run: |
          curl -L -o /tmp/index.html https://github.com/fighterchicken350/sangokushi-gunyu-survival/releases/download/deploy-v20261121_2058/index.html
          echo "a2b30e33e4c6b0e9dc5092011e104911  /tmp/index.html" | md5sum -c -
          ls -l /tmp/index.html
      - name: Replace index.html and remove workflow
        run: |
          cp /tmp/index.html ./index.html
          rm .github/workflows/deploy-index.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -A .github/workflows/deploy-index.yml
          git commit -m "v20261121_2058"
          git push
