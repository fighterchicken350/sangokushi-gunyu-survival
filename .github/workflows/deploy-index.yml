name: Deploy index.html v20261124_0002
on:
  push:
    paths:
      - .github/workflows/deploy-index.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download deploy-v20261124_0002 --repo fighterchicken350/sangokushi-gunyu-survival --pattern 'publish_index_v20261124_0002.html' --dir /tmp/deploy --clobber
          ls -lh /tmp/deploy/
      - name: Verify md5 and replace index.html
        run: |
          echo "47ecc25b29559e55e6dc45ada1ec8231  /tmp/deploy/publish_index_v20261124_0002.html" | md5sum -c -
          cp /tmp/deploy/publish_index_v20261124_0002.html index.html
          ls -lh index.html
          md5sum index.html
      - name: Commit new index.html and delete workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/deploy-index.yml
          git add index.html .github/workflows/deploy-index.yml
          git status --short
          git commit -m "v20261124_0002"
          git push
