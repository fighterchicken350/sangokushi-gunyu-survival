name: Deploy index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download and deploy index.html
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/deploy
          gh release download deploy-tmp --pattern "index.html" --dir /tmp/deploy --clobber
          echo "155990a0f2c395bda17816870d59c053  /tmp/deploy/index.html" | md5sum -c -
          cp /tmp/deploy/index.html index.html
          rm -f .github/workflows/deploy-index.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy v20261126_0405"
          git push
