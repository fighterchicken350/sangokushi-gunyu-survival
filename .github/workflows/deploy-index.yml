name: Deploy index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/deploy
          gh release download deploy-v20261125_2213 --pattern index.html --dir /tmp/deploy --repo fighterchicken350/sangokushi-gunyu-survival
          ls -l /tmp/deploy/index.html
      - name: Verify md5
        run: |
          echo "e2c1a96aa2fe2f729e7677e1f53327d7  /tmp/deploy/index.html" | md5sum -c -
          md5sum /tmp/deploy/index.html
      - name: Replace index.html and remove workflow
        run: |
          cp /tmp/deploy/index.html ./index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/deploy-index.yml
          git add index.html
          git status --short
          git commit -m "v20261125_2213: release audit fixes (#199)"
          git push
