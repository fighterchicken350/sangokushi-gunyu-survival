name: Deploy index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download deploy-v20261124_1406 --pattern index.html --dir /tmp/deploy --repo ${{ github.repository }}
          ls -lh /tmp/deploy/index.html
      - name: Verify md5 and replace index.html
        run: |
          echo "2c32d5746d139b24f0b6fd4a9f3bcd4c  /tmp/deploy/index.html" | md5sum -c -
          cp /tmp/deploy/index.html index.html
          ls -lh index.html
      - name: Commit and delete workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/deploy-index.yml
          git add index.html
          git add -u .github/workflows/deploy-index.yml
          git status --short
          git commit -m "v20261124_1406: detail screen readability (#190)"
          git push
