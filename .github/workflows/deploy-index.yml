name: Deploy index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download deploy-tmp --repo fighterchicken350/sangokushi-gunyu-survival --pattern 'index.html' --dir /tmp/deploy

      - name: Verify md5
        run: |
          echo "f10748ae354aaf7320670b17cc2bca7d  /tmp/deploy/index.html" | md5sum -c -

      - name: Replace index.html and remove this workflow
        run: |
          cp /tmp/deploy/index.html ./index.html
          rm .github/workflows/deploy-index.yml

      - name: Commit everything in one commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy v20261127_1031"
          git push
