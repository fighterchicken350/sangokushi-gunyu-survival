name: Deploy index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/deploy-asset
          gh release download deploy-v20261121_2357 --pattern index.html --dir /tmp/deploy-asset

      - name: Verify MD5
        run: |
          cd /tmp/deploy-asset
          echo "d87164adc208fa0963dfc53f79cf1117  index.html" | md5sum -c -

      - name: Replace index.html and remove workflow
        run: |
          cp /tmp/deploy-asset/index.html ./index.html
          rm .github/workflows/deploy-index.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -A
          git commit -m "v20261121_2357"
          git push
