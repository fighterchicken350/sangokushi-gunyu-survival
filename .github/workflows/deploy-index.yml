name: Deploy index.html
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset and replace index.html
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v20261120_1614 --pattern 'index.html' --dir /tmp/asset
          cp /tmp/asset/index.html ./index.html
          md5sum index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/deploy-index.yml
          git add index.html
          git status --short
          git commit -m "v20261120_1614: boss CC resistance, gauge overlap fixes, rush timer chip, AIKATA splash, unification mode (45 territories, DEM terrain map)"
          git push
