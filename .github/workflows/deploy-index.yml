name: Deploy index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download deploy-work-v20261123_0135 --pattern index.html --dir /tmp/deploy --clobber
          echo "b55e62f6abb85425555c274e5579e360  /tmp/deploy/index.html" | md5sum -c -
          cp /tmp/deploy/index.html ./index.html
      - name: Commit new index and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/deploy-index.yml
          git add index.html
          git add -u .github/workflows/deploy-index.yml
          git commit -m "v20261123_0135"
          git push
