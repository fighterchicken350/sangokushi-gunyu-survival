name: Deploy index v20261123_1900

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/deploy
          gh release download deploy-v20261123_1900 --pattern 'publish_index_v20261123_1900.html' --dir /tmp/deploy
          echo "83c8cbd0ae55ecc05510ee6bb94d207a  /tmp/deploy/publish_index_v20261123_1900.html" | md5sum -c -
          cp /tmp/deploy/publish_index_v20261123_1900.html index.html
      - name: Commit new index.html and remove this workflow
        run: |
          rm .github/workflows/deploy-index.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "v20261123_1900"
          git push
