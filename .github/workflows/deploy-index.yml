name: Deploy index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download release asset and deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download deploy-tmp --pattern "index.html" --dir /tmp/deploy --clobber
          echo "3b84f42c5565525fff3f49e8cdaf5c9c  /tmp/deploy/index.html" | md5sum -c -
          cp /tmp/deploy/index.html ./index.html
          rm -f .github/workflows/deploy-index.yml
      - name: Commit in one commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy v20261127_1445"
          git push
