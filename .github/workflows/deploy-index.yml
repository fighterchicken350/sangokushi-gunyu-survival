name: Deploy index

on:
  push:
    paths:
      - .github/workflows/deploy-index.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/deploy
          gh release download deploy-v20261124_0434 --repo fighterchicken350/sangokushi-gunyu-survival --pattern 'publish_index_v20261124_0434.html' --dir /tmp/deploy
          ls -lh /tmp/deploy
      - name: Verify md5 and replace index.html
        run: |
          echo "ac4c0ccdafe093f8113745a91a1159de  /tmp/deploy/publish_index_v20261124_0434.html" | md5sum -c -
          cp /tmp/deploy/publish_index_v20261124_0434.html index.html
          rm .github/workflows/deploy-index.yml
      - name: Commit deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -u .github/workflows/deploy-index.yml
          git status --short
          git commit -m "v20261124_0434"
          git push
